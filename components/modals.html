<div id="toast-container"></div>
<div class="modal" id="inquiryModal" role="dialog" aria-modal="true" aria-labelledby="inquiryTitle">
    <div class="modal-content">
        <button class="close-btn" onclick="closeInquiryModal()" aria-label="Close">✕</button>
        <h2 class="modal-title" id="inquiryTitle" style="margin-bottom:24px;">Get a Free Quote</h2>

        <form id="multiStepForm" novalidate aria-label="Free Quote Inquiry Form">
            <input type="hidden" name="product_interest" id="hidden-product-interest" value="">
            
            <div class="form-step" id="step2">
                <div class="form-group">
                    <label for="inq-name">Full Name *</label>
                    <input type="text" id="inq-name" name="name" placeholder="Your full name" required
                        autocomplete="name" aria-required="true" aria-describedby="inq-name-help">
                </div>
                <div class="form-group">
                    <label for="inq-email">Email Address *</label>
                    <input type="email" id="inq-email" name="email" placeholder="your@email.com" required
                        autocomplete="email" aria-required="true" aria-describedby="inq-email-help">
                </div>
                <div class="form-group">
                    <label for="inq-phone">Phone Number *</label>
                    <input type="tel" id="inq-phone" name="phone" placeholder="+91 XXXXX XXXXX" required
                        autocomplete="tel" aria-required="true" aria-describedby="inq-phone-help">
                </div>
                <div class="form-group">
                    <label for="inq-msg">Message (Optional)</label>
                    <textarea id="inq-msg" name="message"
                        placeholder="Tell us about your space dimensions..."></textarea>
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="submit" id="finalSubmitBtn" class="btn-primary"
                        style="width: 100%; display: flex; justify-content: center;">
                        Submit Inquiry &rarr;
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- SUCCESS MODAL (Conversion Tracking) -->
<div class="modal" id="successModal" role="dialog" aria-modal="true" aria-labelledby="successTitle">
    <div class="modal-content" style="text-align: center; padding: 48px 32px; max-width: 450px;">
        <div
            style="width: 80px; height: 80px; background: rgba(0,168,107,0.1); color: #00a86b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 24px;">
            ✓</div>
        <h2 class="modal-title" id="successTitle" style="margin-bottom: 16px; font-size: 24px;">Message Sent
            Successfully!</h2>
        <p style="color: var(--light); margin-bottom: 32px; font-size: 15px; line-height: 1.6;">Thank you for
            your
            inquiry. A Space Planners specialist will contact you shortly to discuss your storage requirements.
        </p>
        <button class="submit-btn" onclick="closeSuccessModal()" style="width: 100%; justify-content: center;">Continue
            Browsing</button>
    </div>
</div>

<!-- ERROR MODAL -->
<div class="modal" id="errorModal" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
    <div class="modal-content" style="text-align: center; padding: 48px 32px; max-width: 450px;">
        <div
            style="width: 80px; height: 80px; background: rgba(229,57,53,0.1); color: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 24px;">
            ✕</div>
        <h2 class="modal-title" id="errorTitle" style="margin-bottom: 16px; font-size: 24px; color: var(--red);">
            Submission Failed</h2>
        <p id="errorMessage" style="color: var(--light); margin-bottom: 32px; font-size: 15px; line-height: 1.6;">
            There was an issue sending your inquiry. Please try again or contact us directly.</p>
        <button class="submit-btn" onclick="document.getElementById('errorModal').classList.remove('active')"
            style="width: 100%; justify-content: center;">Try Again</button>
    </div>
</div>
<div class="modal" id="productModal" role="dialog" aria-modal="true">
    <div class="modal-content product-modal-content" style="padding:0; overflow:hidden; border-radius:16px;">
        <button class="close-btn" onclick="closeProductModal()" aria-label="Close"
            style="z-index:10; background:#fff; width:40px; height:40px; border-radius:50%; box-shadow:0 4px 10px rgba(0,0,0,0.15); top:16px; right:16px;">✕</button>
        <div class="product-modal-split" id="productDetailContent"></div>
    </div>
</div>
